<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>Local test fixture — no network chat</title>
<style>
body { font: 16px sans-serif; padding: 30px; }
#prompt-textarea { min-height: 60px; border: 1px solid #999; padding: 12px; }
button { padding: 8px 20px; }
[data-message-author-role] { white-space: pre-wrap; }
</style>
<main>
  <div id="history">
    <div data-message-author-role="user">Start the task.</div>
    <div data-message-author-role="assistant">I will continue.</div>
  </div>
  <form id="composer">
    <div id="prompt-textarea" contenteditable="true" role="textbox" aria-label="Message"><p><br></p></div>
    <button type="button" data-testid="send-button" aria-label="Send prompt" disabled>Send</button>
  </form>
</main>
<script>
window.fixture = {
  allowed: true,
  checks: 0,
  sendClicks: 0,
  acknowledge: true,
  deferAcknowledgement: false,
  cancelOnInput: false,
  inputEvents: 0,
  clipboardCalls: 0,
  windowFocusCalls: 0,
  sentTexts: [],
  checkDelays: [],
  checkReplies: []
};
const editor = document.querySelector('#prompt-textarea');
const send = document.querySelector('[data-testid="send-button"]');
editor.addEventListener('input', () => {
  fixture.inputEvents++;
  send.disabled = !editor.innerText.trim();
  if (fixture.cancelOnInput) fixture.allowed = false;
});
send.addEventListener('click', () => {
  fixture.sendClicks++;
  const text = editor.innerText;
  fixture.sentTexts.push(text);
  if (!fixture.acknowledge) return;
  let acknowledged = false;
  const acknowledge = () => {
    if (acknowledged) return;
    acknowledged = true;
    const message = document.createElement('div');
    message.dataset.messageAuthorRole = 'user';
    message.textContent = text;
    document.querySelector('#history').append(message);
    editor.replaceChildren(document.createElement('p'));
    send.disabled = true;
    const stop = document.createElement('button');
    stop.type = 'button';
    stop.dataset.testid = 'stop-button';
    stop.setAttribute('aria-label', 'Stop streaming');
    stop.textContent = 'Stop';
    document.querySelector('#composer').append(stop);
  };
  if (fixture.deferAcknowledgement) window.acknowledgePending = acknowledge;
  else acknowledge();
});
window.chrome = window.chrome || {};
window.chrome.runtime = {
  sendMessage: async (request) => {
    fixture.checks++;
    if (request.type !== 'CHECK_RUN') throw new Error('Unexpected internal message: ' + request.type);
    const delay = fixture.checkDelays.shift() || 0;
    if (delay) await new Promise(resolve => setTimeout(resolve, delay));
    fixture.checkReplies.push({allowed:fixture.allowed,repliedAt:Date.now()});
    return { ok: true, allowed: fixture.allowed };
  }
};
Object.defineProperty(navigator, 'clipboard', { configurable: true, value: {
  readText() { fixture.clipboardCalls++; throw new Error('Clipboard use is forbidden in fixture'); },
  writeText() { fixture.clipboardCalls++; throw new Error('Clipboard use is forbidden in fixture'); },
  read() { fixture.clipboardCalls++; throw new Error('Clipboard use is forbidden in fixture'); },
  write() { fixture.clipboardCalls++; throw new Error('Clipboard use is forbidden in fixture'); }
}});
window.focus = () => { fixture.windowFocusCalls++; };
</script>
</html>
