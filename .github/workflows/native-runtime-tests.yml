name: Experimental native runtime checks

on:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/native-runtime-tests.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/native-runtime-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native/desktop-commander
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Acquire pinned official Linux runtime for an isolated protocol fixture
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./test-fixtures/fetch-ci-tunnel.ps1
      - name: Generated-profile exchange in the disposable CI runner
        if: runner.os == 'Linux'
        shell: bash
        run: timeout --kill-after=5s 50s node --test tunnel.test.mjs
