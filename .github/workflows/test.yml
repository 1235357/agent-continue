name: Extension checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run vendor
      - run: npm run test:pdf-vendor
      - run: npx playwright install --with-deps chromium
      # A headless background tab is not sufficient evidence of hidden-page
      # behavior. The MV3 and ProseMirror suites assert visibility explicitly.
      - run: xvfb-run -a env TEST_HEADED=1 npm test
      - run: python3 -m unittest discover -s tests -p test_package.py
      - run: python3 -m unittest discover -s tests -p test_release_source.py
      - run: python3 -m unittest discover -s tests -p test_release_installer_pin.py
      - run: python3 scripts/package.py --windows-preview
